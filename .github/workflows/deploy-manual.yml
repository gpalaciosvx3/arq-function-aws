name: Deploy manual · AWS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o SHA a desplegar'
        required: true
        default: master

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: gpalaciosvx3/gpalacios-pipelines/.github/workflows/aws-cdk-deploy.yml@v1
    with:
      ref: ${{ inputs.ref }}
      extra-env: |
        DEPLOY_OBSERVABILITY=${{ vars.DEPLOY_OBSERVABILITY }}
