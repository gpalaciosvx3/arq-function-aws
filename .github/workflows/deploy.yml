name: Deploy · AWS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    uses: gpalaciosvx3/pt-ci-pipelines/.github/workflows/node-validate.yml@v1

  deploy:
    if: github.event_name == 'push'
    uses: gpalaciosvx3/pt-ci-pipelines/.github/workflows/aws-cdk-deploy.yml@v1
    with:
      extra-env: |
        DEPLOY_OBSERVABILITY=${{ vars.DEPLOY_OBSERVABILITY }}
